# docker-compose.yml
# ---------------------------------------------------------
# This file defines and connects ALL our services (containers)
# so they start together with ONE command: `docker compose up`
#
# Right now we have three services:
#   1. db       - PostgreSQL database
#   2. backend  - our FastAPI server
#   3. frontend - our React dev server
#
# Docker Compose creates a private network so these containers
# can find each other BY SERVICE NAME (e.g. the backend connects
# to the database using the hostname "db", not "localhost").
# ---------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data: