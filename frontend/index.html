<!doctype html>
<!--
  index.html
  ---------------------------------------------------------
  This is the ONE real HTML page of our app. React will take
  over the empty <div id="root"> below and inject the entire
  UI into it via JavaScript. This is what "Single Page
  Application" (SPA) means - the browser loads this once,
  and React swaps content in and out without full page reloads.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision AI</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects our compiled JS here, starting with main.tsx -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
